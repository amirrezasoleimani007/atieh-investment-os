<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071827">
  <title>سامانه هوشمند خط‌مشی سرمایه‌گذاری آتیه فولاد</title>
  <style>
    *{box-sizing:border-box}html,body{height:100%;margin:0;background:#071827;font-family:Tahoma,Arial,sans-serif}
    body{overflow:hidden}.shell{height:100%;display:flex;flex-direction:column}
    .bar{height:44px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 18px;color:#d8e7f1;background:linear-gradient(90deg,#071827,#0d3655);border-bottom:1px solid #ffffff1a;font-size:13px}
    .brand{font-weight:700}.status{display:flex;align-items:center;gap:8px;color:#a9c0cf}.status i{width:8px;height:8px;border-radius:50%;background:#49a885;box-shadow:0 0 0 5px #49a88520}
    iframe{width:100%;height:calc(100% - 44px);border:0;background:#f5f3ee}
    .fallback{position:fixed;inset:0;z-index:-1;display:grid;place-items:center;padding:30px;color:#fff;text-align:center}.fallback a{color:#f2cd88}
    @media(max-width:640px){.bar{height:40px;padding:0 10px;font-size:11px}.status span{display:none}iframe{height:calc(100% - 40px)}}
  </style>
</head>
<body>
  <div class="fallback"><p>در حال بارگذاری سامانه…<br><a href="https://atieh-investment-os.amirreza-soleimani11.chatgpt.site">ورود مستقیم به سامانه</a></p></div>
  <main class="shell">
    <header class="bar"><span class="brand">سامانه هوشمند خط‌مشی سرمایه‌گذاری آتیه فولاد</span><span class="status"><i></i><span>نسخه اجرایی</span></span></header>
    <iframe src="https://atieh-investment-os.amirreza-soleimani11.chatgpt.site" title="سامانه IPS" allow="fullscreen" loading="eager"></iframe>
  </main>
</body>
</html>
